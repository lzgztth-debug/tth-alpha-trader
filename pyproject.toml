[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "alphatrader"
version = "6.0.0"
description = "AI Agent 自动化交易平台 - 基于大语言模型的智能交易系统"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AI Trading Team", email = "trading@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.23,<3.0.0",
    "aiosqlite>=0.19.0,<1.0.0",
    "aiohttp>=3.9.1,<4.0.0",
    "httpx>=0.25.2,<1.0.0",
    "openai>=1.6.0,<2.0.0",
    "anthropic>=0.8.0,<1.0.0",
    "dashscope>=1.14.0,<2.0.0",
    "yfinance>=0.2.31,<1.0.0",
    "ccxt>=4.1.0,<5.0.0",
    "pandas>=2.1.4,<3.0.0",
    "numpy>=1.26.2,<2.0.0",
    "plotly>=5.18.0,<6.0.0",
    "pydantic>=2.5.2,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "cryptography>=41.0.7,<43.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    "loguru>=0.7.2,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3,<8.0.0",
    "pytest-asyncio>=0.23.2,<1.0.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
ai-trading = "src.api.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
